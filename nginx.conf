server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # Cada página es una carpeta con su index.html: las URLs sin barra final
    # (/panel, /en/pricing…) redirigen 301 a la versión con barra.
    location ~ ^/(en|panel|precio|como-funciona|en/panel|en/pricing|en/how-it-works)$ { return 301 $uri/; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Un cuarto 404 real (no el index) para URLs que no existen
    error_page 404 /404.html;
    location = /sitemap.xml { default_type application/xml; }
    location = /llms.txt { default_type "text/plain; charset=utf-8"; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
