server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirecciones relativas: detrás de Traefik, nginx no sabe que el
    # visitante entró por https y armaría un Location con http://.
    absolute_redirect off;

    # Una sola URL por demo: /plumbers -> /plumbers/ (301). Google estaba
    # indexando las dos versiones y repartiendo la fuerza entre ellas. Solo
    # aplica a rutas de un segmento sin punto (no toca /favicon.ico, etc.).
    location ~ ^/([A-Za-z0-9_-]+)$ {
        return 301 /$1/;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (necesario para que /salon-belleza funcione al entrar directo por URL)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
