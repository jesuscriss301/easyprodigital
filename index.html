      /* Aplica el tema guardado antes del primer pintado, evitando el parpadeo claro→oscuro */

        try {
          var saved = localStorage.getItem('epd-theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved)
          }
        } catch (e) {}
      })()
    </script>
