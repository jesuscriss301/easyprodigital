# Config de Graphiti MCP — adaptada de config-docker-falkordb.yaml del
# proyecto oficial (getzep/graphiti) para usar Anthropic como LLM y Voyage
# como proveedor de embeddings (Anthropic no publica una API de embeddings
# propia).
server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "anthropic"
  model: ${MODEL_NAME:claude-sonnet-4-5}
  max_tokens: 4096

  providers:
    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      api_url: ${ANTHROPIC_API_URL:https://api.anthropic.com}
      max_retries: 3

embedder:
  provider: "voyage"
  model: ${EMBEDDER_MODEL:voyage-3}

  providers:
    voyage:
      api_key: ${VOYAGE_API_KEY}
      api_url: ${VOYAGE_API_URL:https://api.voyageai.com/v1}
      model: ${EMBEDDER_MODEL:voyage-3}

database:
  provider: "falkordb"

  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://falkordb:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:default_db}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:jesus_cristancho}
  entity_types:
    - name: "Preference"
      description: "Preferencias, elecciones u opiniones del usuario (PRIORIZAR sobre casi todo lo demás)"
    - name: "Requirement"
      description: "Necesidades o funcionalidades específicas que deben cumplirse"
    - name: "Procedure"
      description: "Procedimientos estándar e instrucciones secuenciales"
    - name: "Organization"
      description: "Empresas, clientes, entidades formales (ej. easyprodigital, clientes freelance)"
    - name: "Document"
      description: "Contenido informativo (repos, documentos, reportes)"
    - name: "Topic"
      description: "Tema de conversación o dominio de conocimiento (último recurso)"
    - name: "Object"
      description: "Objetos, herramientas o posesiones físicas (último recurso)"
